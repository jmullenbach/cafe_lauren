[project]
name = "cafe"
version = "0.1.0"
description = "Café Lauren backend: weekly meal planning for the household"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "claude-agent-sdk>=0.2.163",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cafe-migrate = "cafe.db:migrate_cli"
cafe-seed-demo = "cafe.seed_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cafe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:Using `httpx`", "ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
