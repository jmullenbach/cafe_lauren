<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="Quiet ease-out; 140 / 220 / 360ms; no bounce" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--surface-page);font:var(--type-body)}.g{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:6px;border:1px solid rgba(36,34,31,.06)}.n{font:600 12px/1.2 var(--font-sans);color:var(--text-strong)}.v{font:400 11px/1.2 var(--font-sans);color:var(--text-muted)}@keyframes m{to{transform:translateX(150%)}}</style></head><body>
<div class="g" style="gap:20px"><div class="sw" style="padding:14px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:10px"><span class="n">--dur-fast · 140ms</span><span class="v">hover, checkbox</span><div style="height:4px;background:var(--linen-200);border-radius:2px;overflow:hidden;margin-top:8px"><div style="height:100%;width:40%;background:var(--sage-500);animation:m 140ms var(--ease-out) infinite alternate"></div></div></div><div class="sw" style="padding:14px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:10px"><span class="n">--dur-base · 220ms</span><span class="v">card lift, switch</span><div style="height:4px;background:var(--linen-200);border-radius:2px;overflow:hidden;margin-top:8px"><div style="height:100%;width:40%;background:var(--sage-500);animation:m 220ms var(--ease-out) infinite alternate"></div></div></div><div class="sw" style="padding:14px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:10px"><span class="n">--dur-slow · 360ms</span><span class="v">photo zoom, dialogs</span><div style="height:4px;background:var(--linen-200);border-radius:2px;overflow:hidden;margin-top:8px"><div style="height:100%;width:40%;background:var(--sage-500);animation:m 360ms var(--ease-out) infinite alternate"></div></div></div></div><div class="v" style="margin-top:10px">--ease-out cubic-bezier(.2,.7,.2,1)</div>
</body></html>
