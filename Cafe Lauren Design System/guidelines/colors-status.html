<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Sale, success, warning, danger, info — fg on soft bg" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--surface-page);font:var(--type-body)}.g{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:6px;border:1px solid rgba(36,34,31,.06)}.n{font:600 12px/1.2 var(--font-sans);color:var(--text-strong)}.v{font:400 11px/1.2 var(--font-sans);color:var(--text-muted)}</style></head><body>
<div class="g"><div class="sw"><div class="chip" style="background:var(--status-sale-bg);display:grid;place-items:center;font:600 13px var(--font-sans);color:var(--status-sale)">Sale</div><span class="n">--status-sale</span><span class="v">+ --status-sale-bg</span></div><div class="sw"><div class="chip" style="background:var(--status-success-bg);display:grid;place-items:center;font:600 13px var(--font-sans);color:var(--status-success)">Success</div><span class="n">--status-success</span><span class="v">+ --status-success-bg</span></div><div class="sw"><div class="chip" style="background:var(--status-warning-bg);display:grid;place-items:center;font:600 13px var(--font-sans);color:var(--status-warning)">Warning</div><span class="n">--status-warning</span><span class="v">+ --status-warning-bg</span></div><div class="sw"><div class="chip" style="background:var(--status-danger-bg);display:grid;place-items:center;font:600 13px var(--font-sans);color:var(--status-danger)">Danger</div><span class="n">--status-danger</span><span class="v">+ --status-danger-bg</span></div><div class="sw"><div class="chip" style="background:var(--status-info-bg);display:grid;place-items:center;font:600 13px var(--font-sans);color:var(--status-info)">Info</div><span class="n">--status-info</span><span class="v">+ --status-info-bg</span></div></div>
</body></html>
