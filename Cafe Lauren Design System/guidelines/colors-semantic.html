<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--surface-page);font:var(--type-body)}.g{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:6px;border:1px solid rgba(36,34,31,.06)}.n{font:600 12px/1.2 var(--font-sans);color:var(--text-strong)}.v{font:400 11px/1.2 var(--font-sans);color:var(--text-muted)}</style></head><body>
<div class="g"><div class="sw"><div class="chip" style="background:var(--surface-page);display:flex;align-items:flex-end;padding:8px;font:500 12px var(--font-sans);color:var(--text-strong)">Aa</div><span class="n">surface-page</span></div><div class="sw"><div class="chip" style="background:var(--surface-sunken);display:flex;align-items:flex-end;padding:8px;font:500 12px var(--font-sans);color:var(--text-strong)">Aa</div><span class="n">surface-sunken</span></div><div class="sw"><div class="chip" style="background:var(--surface-card);display:flex;align-items:flex-end;padding:8px;font:500 12px var(--font-sans);color:var(--text-strong)">Aa</div><span class="n">surface-card</span></div><div class="sw"><div class="chip" style="background:var(--surface-accent);display:flex;align-items:flex-end;padding:8px;font:500 12px var(--font-sans);color:var(--text-strong)">Aa</div><span class="n">surface-accent</span></div><div class="sw"><div class="chip" style="background:var(--surface-wood);display:flex;align-items:flex-end;padding:8px;font:500 12px var(--font-sans);color:var(--text-strong)">Aa</div><span class="n">surface-wood</span></div><div class="sw"><div class="chip" style="background:var(--surface-inverse);display:flex;align-items:flex-end;padding:8px;font:500 12px var(--font-sans);color:var(--text-inverse)">Aa</div><span class="n">surface-inverse</span></div></div><div class="g" style="margin-top:14px"><span style="flex:1;font:600 14px var(--font-sans);color:var(--text-strong)">text-strong</span><span style="flex:1;font:600 14px var(--font-sans);color:var(--text-body)">text-body</span><span style="flex:1;font:600 14px var(--font-sans);color:var(--text-muted)">text-muted</span><span style="flex:1;font:600 14px var(--font-sans);color:var(--text-faint)">text-faint</span><span style="flex:1;font:600 14px var(--font-sans);color:var(--text-accent)">text-accent</span></div>
</body></html>
