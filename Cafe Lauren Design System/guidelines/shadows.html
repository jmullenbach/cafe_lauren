<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--surface-page);font:var(--type-body)}.g{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:6px;border:1px solid rgba(36,34,31,.06)}.n{font:600 12px/1.2 var(--font-sans);color:var(--text-strong)}.v{font:400 11px/1.2 var(--font-sans);color:var(--text-muted)}</style></head><body>
<div class="g" style="gap:24px;padding:8px"><div class="sw"><div style="height:80px;background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-1)"></div><span class="n">--shadow-1</span><span class="v">resting card</span></div><div class="sw"><div style="height:80px;background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-2)"></div><span class="n">--shadow-2</span><span class="v">hover / raised</span></div><div class="sw"><div style="height:80px;background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-3)"></div><span class="n">--shadow-3</span><span class="v">dialog / toast</span></div><div class="sw"><div style="height:80px;background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-inset)"></div><span class="n">--shadow-inset</span><span class="v">input well</span></div><div class="sw"><div style="height:80px;background:var(--surface-card);border-radius:10px;box-shadow:var(--focus-ring)"></div><span class="n">--focus-ring</span><span class="v">keyboard focus</span></div></div>
</body></html>
