<!-- @dsCard group="Colors" viewport="700x120" name="Day tags" subtitle="Earthy versions of the Notion menu Tags palette" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--surface-page);font:var(--type-body)}.g{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:6px;border:1px solid rgba(36,34,31,.06)}.n{font:600 12px/1.2 var(--font-sans);color:var(--text-strong)}.v{font:400 11px/1.2 var(--font-sans);color:var(--text-muted)}</style></head><body>
<div class="g" style="flex-wrap:wrap"><div style="display:flex;flex-direction:column;gap:6px"><span style="height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:3px;background:var(--day-week);color:var(--day-week-ink);font:700 10.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase">This week</span><span class="v">--day-week</span></div><div style="display:flex;flex-direction:column;gap:6px"><span style="height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:3px;background:var(--day-mon);color:var(--day-mon-ink);font:700 10.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase">Monday</span><span class="v">--day-mon</span></div><div style="display:flex;flex-direction:column;gap:6px"><span style="height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:3px;background:var(--day-tue);color:var(--day-tue-ink);font:700 10.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase">Tuesday</span><span class="v">--day-tue</span></div><div style="display:flex;flex-direction:column;gap:6px"><span style="height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:3px;background:var(--day-wed);color:var(--day-wed-ink);font:700 10.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase">Wednesday</span><span class="v">--day-wed</span></div><div style="display:flex;flex-direction:column;gap:6px"><span style="height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:3px;background:var(--day-thu);color:var(--day-thu-ink);font:700 10.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase">Thursday</span><span class="v">--day-thu</span></div><div style="display:flex;flex-direction:column;gap:6px"><span style="height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:3px;background:var(--day-fri);color:var(--day-fri-ink);font:700 10.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase">Friday</span><span class="v">--day-fri</span></div><div style="display:flex;flex-direction:column;gap:6px"><span style="height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:3px;background:var(--day-sat);color:var(--day-sat-ink);font:700 10.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase">Saturday</span><span class="v">--day-sat</span></div><div style="display:flex;flex-direction:column;gap:6px"><span style="height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:3px;background:var(--day-sun);color:var(--day-sun-ink);font:700 10.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase">Sunday</span><span class="v">--day-sun</span></div><div style="display:flex;flex-direction:column;gap:6px"><span style="height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:3px;background:var(--day-spare);color:var(--day-spare-ink);font:700 10.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase">Spare</span><span class="v">--day-spare</span></div></div>
</body></html>
